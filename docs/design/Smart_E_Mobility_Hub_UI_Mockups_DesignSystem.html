/* === Design System alignment: tokens from TV5's published HTML === */
:root{
  --brand-900:#1f4e79; --brand-700:#2f6aa0; --brand-500:#4a8fc7; --brand-100:#eaf1f8;
  --accent-600:#b4690e; --accent-100:#fff4e0;
  --ink-900:#1f2d3d; --ink-700:#44546a; --ink-500:#6b7a8f; --ink-300:#aebac8; --ink-100:#eef2f6; --ink-0:#ffffff;
  --success-700:#1e7a46; --success-100:#e9f7ef;
  --warning-700:#9a6b00; --warning-100:#fff3d6;
  --danger-700:#b3261e; --danger-100:#fdecea;
  --info-700:#2a5db0; --info-100:#e8f0fd;
  --neutral-700:#5b6572; --neutral-100:#eef1f4;
  --font-ui:'Be Vietnam Pro',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
  --radius:10px; --radius-sm:6px;
  --navy:var(--brand-900); --navy2:var(--brand-700); --teal:var(--brand-900); --teal2:var(--brand-100);
  --ink:var(--ink-900); --muted:var(--ink-500); --line:var(--ink-300); --bg:var(--ink-100); --white:var(--ink-0);
  --blue:var(--info-700); --green:var(--success-700); --amber:var(--warning-700); --red:var(--danger-700); --purple:var(--info-700);
  --shadow:0 4px 16px rgba(31,45,61,.07);
}
body{font-family:var(--font-ui)!important;background:var(--ink-100)!important;color:var(--ink-900)!important}
button,input,select,textarea{font-family:var(--font-ui)}
code,.navnum{font-family:var(--font-mono)}
.app .sidebar{background:var(--brand-900)}
.brandmark{background:linear-gradient(135deg,var(--brand-500),var(--brand-700));color:#fff;box-shadow:0 4px 12px rgba(31,78,121,.2);border-radius:10px}
.navbtn{border-radius:6px}
.navbtn.active{background:var(--accent-600);color:#fff}
.eyebrow{color:var(--brand-900)}
.btn{border-radius:6px;border-color:var(--ink-300)}
.btn.primary{background:var(--brand-900);border-color:var(--brand-900);color:#fff}
.btn.danger{background:var(--danger-100);border-color:var(--danger-100);color:var(--danger-700)}
.tabs{background:var(--ink-100);border-radius:10px}
.tab{border-radius:6px;color:var(--ink-700)}
.card,.hubcard,.vehiclecard,.reccard{border-color:var(--ink-300);border-radius:10px;box-shadow:var(--shadow)}
.field label{color:var(--ink-700)}
.field input,.field select,.field textarea{border-color:var(--ink-300);border-radius:6px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(74,143,199,.15)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(74,143,199,.3);outline-offset:2px}
.metric-icon{background:var(--brand-100);color:var(--brand-900)}
.metric-icon.blue{background:var(--info-100);color:var(--info-700)}
.metric-icon.amber{background:var(--warning-100);color:var(--warning-700)}
.metric-icon.red{background:var(--danger-100);color:var(--danger-700)}
.pill{background:var(--neutral-100);color:var(--neutral-700);border-radius:999px}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function active(){return modules.find(m=>m.id===currentModule)}
function pill(text,tone=''){return `<span class="pill ${tone}">${text}</span>`}
function btn(text,action,klass=''){return `<button class="btn ${klass}" data-action="${action}">${text}</button>`}
function metric(label,value,foot,icon,tone=''){return `<div class="card"><div class="metric"><div><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div><div class="metric-icon ${tone}">${icon}</div></div></div>`}
function cardhead(title,desc='',extra=''){return `<div class="cardhead"><div><div class="cardtitle">${title}</div>${desc?`<div class="carddesc">${desc}</div>`:''}</div>${extra}</div>`}
function pageHead(title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${currentModule} · ${active().full}</div><h1 class="pagetitle">${title}</h1><div class="subtitle">${desc}</div></div><div class="head-actions">${actions}</div></div>`}
function bar(pct,tone=''){return `<div class="bar ${tone}"><span style="width:${Math.max(0,Math.min(100,pct))}%"></span></div>`}
function tabs(items){return `<div class="tabs">${items.map(([id,label])=>`<button class="tab ${subtab[currentModule]===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>`}
function statusPill(s){let lo=s.toLowerCase();let t='';if(['failed','faulty','interrupted','blocked','urgent'].some(x=>lo.includes(x)))t='red';else if(['lowbattery','underrepair','high'].some(x=>lo.includes(x)))t='amber';else if(['confirmed','scheduled','reserved','assigned'].some(x=>lo.includes(x)))t='blue';else if(['inuse','occupied','charging','inprogress','running','intransit'].some(x=>lo.includes(x)))t='brand';else if(['completed','checkedin','done','resolved','closed','applied','available','active','healthy'].some(x=>lo.includes(x)))t='green';else if(['pending','queued','requested','created','draft','cancelled','expired','discarded'].some(x=>lo.includes(x)))t='';return pill(s,t)}
function renderNav(){
 const operatorNav=[
  {id:'M1',code:'M1',name:'Hub network dashboard',tab:'overview'},

 ];
 document.getElementById('nav').innerHTML=operatorNav.map(m=>`<button class="navbtn ${m.id===currentModule?'active':''}" data-module="${m.id}" data-starttab="${m.tab}"><span class="navnum">${m.code}</span><span>${m.name}</span></button>`).join('')+`<button class="navbtn" data-action="profile"><span class="navnum">ID</span><span>Profile / account settings</span></button>`;
}

 const items=[

 ];

 }).join('');

function render(){document.body.dataset.role=role.toLowerCase();renderNav();renderStudentNav();document.getElementById('crumb').textContent=active().name;document.getElementById('topTitle').textContent=active().full;document.getElementById('avatar').textContent=role==='Operator'?'OP':'ST';document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.getElementById('content').innerHTML=views[currentModule]();document.getElementById('globalSearch').placeholder=currentModule==='M8'?'Search scenarios…':'Search hubs, vehicles…';const picker=document.getElementById('previewModule');if(picker)picker.value=currentModule;}
function viewM1(){let sub=subtab.M1;if(role==='Student'&&sub==='overview'){sub='hubs';subtab.M1='hubs';}let out=pageHead(role==='Operator'?'Network operations':'Find a Mobility Hub',role==='Operator'?'A live view of vehicle availability, parking capacity and charging infrastructure across the campus network.':'Find a nearby hub with available vehicles, parking spaces or charging points.',role==='Operator'?btn('↻ Refresh data','refresh',''):btn('⌖ Use current area','hubarea',''));out+=tabs([['overview','Overview'],['hubs','Hub directory'],['alerts','Alert history']]);if(role==='Operator'&&sub==='overview'){out+=`<div class="grid metrics">${metric('Mobility hubs','12','Across 6 campus zones','⌂')}${metric('Vehicles online','248','74 available now','↗','blue')}${metric('Parking utilization','68%','Across operational spaces','▦','amber')}${metric('Open alerts','03','1 high · 2 medium','⚠','red')}</div><div class="grid two"><div class="card">${cardhead('Hub utilization','Parking occupied + reserved / total slots',pill('Live','green'))}<div class="tablewrap"><table><thead><tr><th>Hub</th><th>Available vehicles</th><th>Parking</th><th>Charging</th><th>Utilization</th></tr></thead><tbody>${hubs.slice(0,5).map(h=>`<tr><td><div class="hubname">${h.name}</div><div class="subline">${h.area}</div></td><td><b>${h.available}</b> <span class="muted">/ ${h.vehicles}</span></td><td>${h.slotsFree} / ${h.slots}</td><td>${h.portsFree} / ${h.ports}</td><td style="min-width:120px">${bar(h.util,h.util>=80?'red':h.util>=50?'amber':'')}<div class="subline">${h.util}% used</div></td></tr>`).join('')}</tbody></table></div><div class="footer-note">Refresh is simulated. In production, the UI updates on ResourceStateUpdated events without a page reload.</div></div><div class="card">${cardhead('Open alerts','Thresholds evaluated every 30 seconds',pill('3 open','red'))}<div class="incidentrow"><div class="incidenticon">⚠</div><div class="incidentbody"><div class="incidenttitle">Hub near parking capacity</div><div class="incidentmeta">Metro Gateway · 82% utilization · 14:28</div></div>${pill('OPEN','red')}</div><div class="incidentrow"><div class="incidenticon">↘</div><div class="incidentbody"><div class="incidenttitle">Low vehicle availability</div><div class="incidentmeta">Metro Gateway · 4 available (demo threshold sample) · 14:26</div></div>${pill('OPEN','amber')}</div><div class="incidentrow"><div class="incidenticon">⚡</div><div class="incidentbody"><div class="incidenttitle">Charging demand rising</div><div class="incidentmeta">Dormitory A · 1 port free · 14:21</div></div>${pill('OPEN','amber')}</div><div class="divider"></div>${btn('Review incidents →','gom6','')}</div></div>`;}
else if(sub==='alerts'&&role==='Operator'){out+=`<div class="card">${cardhead('Alert history','Filter alerts raised in a selected time window',btn('Export CSV','exportalerts',''))}<div class="filters"><div class="field"><label>Time range</label><select><option>Last 24 hours</option><option>Last 7 days</option></select></div><div class="field"><label>Hub</label><select><option>All hubs</option>${hubs.map(h=>`<option>${h.name}</option>`).join('')}</select></div><div class="field"><label>Type</label><select><option>All alerts</option><option>CAPACITY</option><option>LOW_VEHICLE</option></select></div></div><div class="tablewrap"><table><thead><tr><th>Raised at</th><th>Hub</th><th>Alert</th><th>Trigger value</th><th>State</th><th>Action</th></tr></thead><tbody><tr><td>14:28:04</td><td>Metro Gateway</td><td>Capacity threshold</td><td>82%</td><td>${pill('OPEN','red')}</td><td>${btn('Acknowledge','ackalert','small')}</td></tr><tr><td>14:26:48</td><td>Metro Gateway</td><td>Low vehicle count</td><td>4 available</td><td>${pill('ACKNOWLEDGED','amber')}</td><td>${btn('Dismiss','dismissalert','small')}</td></tr><tr><td>13:12:09</td><td>Library Hub</td><td>Capacity threshold</td><td>76% → 69%</td><td>${pill('RESOLVED','green')}</td><td><span class="muted">—</span></td></tr></tbody></table></div></div>`;}

function viewM2(){let sub=subtab.M2;if(role==='Operator'){}const vehicles=[['EB-074','E-bike',12,'Metro Gateway','Battery low'],['ES-208','E-scooter',74,'Metro Gateway','Available'],['EB-112','E-bike',62,'Campus Center','Available'],['ES-316','E-scooter',88,'Library Hub','Available']];let filtered=vehicles.filter(v=>!booking||booking.vehicle===v[0]||true);let out=pageHead('Find your next ride','Search rental vehicles by Hub, type and minimum battery level. Only available vehicles are offered for reservation.',btn('My reservation','myreservation',''));out+=tabs([['find','Find vehicles'],['reservation','My reservation']]);if(sub==='reservation'){out+=`<div class="grid two"><div class="card">${cardhead('Current reservation','Reservation core · one active reservation per vehicle',booking?pill('CONFIRMED','green'):pill('No active booking'))}${booking?`<div class="vehiclehead"><div class="vehicleicon">${booking.type==='E-bike'?'🚲':'🛴'}</div><div><div class="cardtitle">${booking.vehicle}</div><div class="carddesc">${booking.hub}</div></div></div><div class="divider"></div><div class="grid three"><div><div class="tiny">Battery</div><b>${booking.battery}%</b></div><div><div class="tiny">Hold expires</div><b>14:42</b></div><div><div class="tiny">Reservation ID</div><b>RSV-2180</b></div></div><div class="callout warning" style="margin-top:15px">⏱ Your vehicle is held for the configured reservation window. Pick it up before the timer expires.</div><div style="margin-top:15px">${btn('Cancel reservation','cancelbooking','danger')}</div>`:`<div class="empty"><div class="emptyicon">⌕</div><b>No active reservation</b><p>Choose an available vehicle to reserve your ride.</p>${btn('Find vehicles','gofind','primary')}</div>`}</div><div class="card">${cardhead('Reservation rules','Help keep the fleet available')}<div class="timeline"><div class="timeitem"><strong>1. Search</strong><p>Filter by Hub, vehicle type and minimum battery.</p></div><div class="timeitem"><strong>2. Reserve</stron ld be returned.</p>`;}return out;}

rsonal vehicle</label><select id="chargeVehicle">${personalVehicles.map(v=>`<option>${v.plate} · ${v.model}</option>`).join('')}<option>59-E1 223.88 · VinFast Feliz</option></select></div><div class="field"><label>Hub</label><select id="chargeHub">${hubs.map(h=>`<option ${h.name==='Campus Center'?'selected':''}>${h.name}</option>`).join('')}</select></div><div class="field"><label>Start time</label><select id="chargeStart"><option>15:00</option><option>15:30</option><option>16:00</option><option>16:30</option><option>17:00</option></select></div><div class="field"><label>Duration</label><select id="chargeDuration"><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label>Parking reservation</label><select id="chargeParking"><option>Campus Center · P-04 · 14:30–17:00</option><option>Library Hub · P-02 · 15:00–16:30</option></select></div></div><div class="callout" style="margin-top:14px">Schedules must begin within 24 hours, use 30-minute time slots, last 30–90 minutes, and fit inside a parking reservation at the same Hub.</div><div style="margin-top:14px">${btn('Confirm charging schedule','bookcharge','primary')}</div></div><div class="card">${cardhead('Upcoming schedules','Existing holds are not applied to other Hubs')}<div class="incidentrow"><div class="incidenticon" style="background:#e9f7ef;color:#1f4e79">⚡</div><div class="incidentbody"><div class="incidenttitle">${scheduleBooked?'New schedule · '+(document.getElementById?.('chargeStart')?.value||'15:00'):'Thu 16:00 · Campus Center'}</div><div class="incidentmeta">PV-481 · CP-09 · 60 minutes</div></div>${pill(scheduleBooked?'Scheduled':'Confirmed','green')}</div><div class="footer-note">A port is held for 10 minutes from the scheduled start. If the vehicle does not connect, the session is cancelled and the next queued session may be assigned.</div></div></div>`;}else{out+=`<div class="grid two"><div class="card">${ function viewM8(){let sub=subtab.M8;let out=pageHead('What-if simulation studio','Run an isolated simulation from a consistent network snapshot, compare deterministic KPIs and review recommendations before any real operational action.',btn('Run configured forecast','runscheduled',''));out+=tabs([['scenario','Scenario builder'],['results','Results & compare'],['recommendations','Recommendations']]);if(sub==='scenario'){out+=`<div class="scenario-layout"><div class="card">${cardhead('Define a scenario','Choose a template, review every input and confirm before the run starts.')}<div class="sectioncaption">Scenario template</div><div class="presetgrid">${[['metro','🚇','Metro peak-hour surge','Arrivals rise at the Metro Gateway'],['parking','▦','Hub parking saturation','One Hub reaches parking capacity'],['charging','⚡','Charging demand surge','More charging requests across Hubs'],['charger','⚠','Partial charger failure','Some charging points become unavailable'],['balance','⇄','Fleet imbalance','Too many / too few vehicles in an area']].map(([id,icon,title,desc])=>`<button class="preset ${scenarioPreset===id?'active':''}" data-preset="${id}"><span style="font-size:20px">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`).join('')}</div><div class="divider"></div><div class="formgrid"><div class="field wide"><label>Scenario name</label><input id="scenarioName" value="${scenarioName}" /></div><div class="field"><label>Affected Hub</label><select id="scenarioHub">${hubs.map(h=>`<option ${h.name==='Metro Gateway'?'selected':''}>${h.name}</option>`).join('')}</select></div><div class="field"><label>Simulation horizon</label><select id="scenarioHorizon"><option>60 minutes</option><option>120 minutes</option><option>180 minutes</option></select></div><div class="field"><label>Additional arrivals</label><input id="scenarioArrivals" type="number" min="0" value="${scenarioPreset==='metro'?120:60}" /></div><div class="field"><label>Failed charging points</label><input id="scenarioFailed" type="number" min="0" value="${scenarioPreset==='charger'?2:0}" /></div></div><div class="callout" style="margin-top:14px">AI-assisted text entry may suggest parameters, but every suggestion is editable. Invalid or ambiguous values must be fixed before “Save & Run”. The simulation uses an isolated copy and cannot mutate live Hub resources.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${btn('Suggest parameters with AI','suggestscenario','')}${btn(scenarioRun?'Run new version':'Save & Run Simulation','runsimulation','primary')}</div></div><div class="card">${cardhead('Latest simulation','Snapshot → discrete time steps → KPI calculation → save',scenarioRun?pill('COMPLETED','green'):pill('No run yet'))}${scenarioRun?`<div class="tiny">RUN-${runNumber} · ${scenarioName} · Snapshot 14:30:00</div><div class="kpirow" style="margin:16px 0">${[['Service rate',simulationValues.service+'%','+4.8 pp'],['Mean wait',simulationValues.wait+' min','−2.1 min'],['Resource use',simulationValues.util+'%','balanced']].map(([a,b,c])=>`<div class="kpibox"><span>${a}</span><strong>${b}</strong><small>${c}</small></div>`).join('')}</div>${btn('Inspect results →','goresults','primary')}`:`<div class="empty"><div class="emptyicon">◉</div><b>Ready to simulate</b><p>Your last completed run and its snapshot metadata will appear here.</p></div>`}<div class="divider"></div><div class="sectioncaption">Execution stages</div><div class="timeline"><div class="timeitem"><strong>1 · Capture snapshot</strong><p>Consistent version/time. Do not start if snapshot is unavailable.</p></div><div class="timeitem"><strong>2 · Simulate isolated copy</strong><p>Apply hypothetical demand and resource changes with discrete time steps.</p></div><div class="timeitem"><strong>3 · Calculate & persist KPIs</strong><p>Deterministic service rate, observed mean wait and utilization.</p></div></div></div></div>`;}else if(sub==='results'){out+=`<div class="card">${cardhead('Run history & comparison','Only completed runs can be compared.',btn('New scenario version','goscenario',''))}<div class="tablewrap"><table><thead><tr><th>Run ID</th><th>Scenario</th><th>Snapshot time</th><th>Horizon</th><th>Service rate</th><th>Mean wait</th><th>Status</th><th></th></tr></thead><tbody><tr><td><b>RUN-${runNumber}</b></td><td>${scenarioName}</td><td>Today · 14:30</td><td>60 min</td><td>${simulationValues.service}%</td><td>${simulationValues.wait} min</td><td>${statusPill(scenarioRun?'COMPLETED':'PENDING')}</td><td>${btn('Select','selectrun','small')}</td></tr><tr><td><b>RUN-011</b></td><td>Baseline · weekday</td><td>Today · 14:00</td><td>60 min</td><td>86.6%</td><td>8.9 min</td><td>${pill('COMPLETED','green')}</td><td>${btn('Compare','compare','small')}</td></tr></tbody></table></div>${compareMode?`<div class="divider"></div><div class="kpirow"><div class="kpibox"><span>Service rate delta</span><strong>+4.8 pp</strong><small>New run − baseline</small></div><div class="kpibox"><span>Mean wait delta</span><strong>−2.1 min</strong><small>Lower is better</small></div><div class="kpibox"><span>Resource utilization delta</span><strong>+6 pp</strong><small>Check Hub-level imbalance</small></div></div><div class="callout warning" style="margin-top:13px">Compare snapshot times, horizon, demand assumptions and KPI definitions before interpreting changes. N/A denominators remain N/A.</div>`:`<div class="empty" style="margin-top:16px"><div class="emptyicon">⇄</div><b>Select two completed runs</b><p>Choose a baseline to compare service rate, mean wait, utilization and initial conditions.</p>${btn('Compare with baseline','compare','primary')}</div>`}</div>`;}else{out+=`<div class="grid two"><div class="card">${cardhead('Coordination recommendations','AI proposals are not operational actions until approved by an authorized Operator.',pill('Human-in-the-loop','amber'))}<div class="reccard"><div class="labelrow"><b>Move 3 vehicles to Metro Gateway</b>${pill('PROPOSED','purple')}</div><div class="recroute"><span class="routepoint">Campus Center</span><span class="routearrow">→</span><span class="routepoint">Metro Gateway</span></div><div class="carddesc">Projected service rate improves by 4.8 percentage points; source Hub remains above its fleet minimum.</div><div class="recfooter"><span class="tiny">Source: RUN-${runNumber}</span>${btn('Discard proposal','discardrec','')}</div></div><div class="reccard"><div class="labelrow"><b>Reschedule low-battery sessions</b>${pill('PROPOSED','purple')}</div><div class="carddesc" style="margin-top:8px">Prioritize two low-SoC vehicles and avoid the CP-07 failed-port window.</div><div class="recfooter"><span class="tiny">Requires M5 feasibility check</span>${btn('Apply proposal','applyrec','primary small')}</div></div><div class="callout warning">Apply submits the proposal to the owning operational service, which rechecks current constraints. The UI displays accepted / completed / rejected / failed / unknown outcomes distinctly.</div></div><div class="card">${cardhead('Scheduled early warning','Background cycle runs every 30 minutes',pill('MONITORING','green'))}<div class="kpibox" style="margin-bottom:14px"><span>Observed mean waiting time</span><strong>8.9 min</strong><small>Warning threshold: 12.0 min</small></div><div class="callout success">No warning for the last cycle. A warning is raised only when the observed mean waiting time exceeds the configured threshold. Scheduled runs never apply real-world actions automatically.</div><div style="margin-top:14px">${btn('Open last scheduled run','goresults','')}</div></div></div>`;}return out;}

 else if(action==='gom1')move('M1','hubs'); else if(action==='gom2')move('M2','find');else if(action==='gom3')move('M3','trip');else if(action==='gom4')move('M4','parking');else if(action==='gom5')move('M5','queue');else if(action==='gom6')move('M6','incidents');else if(action==='gom7')move('M7','recommendations');else if(action==='gom8')move('M8','scenario');
 else if(action==='myreservation')move('M2','reservation');else if(action==='gofind')move('M2','find');else if(action==='gotoreturn')move('M3','return');else if(action==='goparking')move('M4','parking');else if(action==='parkingpass')move('M4','passes');else if(action==='goscenario')move('M8','scenario');else if(action==='goresults')move('M8','results');else if(action==='compare'){compareMode=true;move('M8','results')}else if(action==='selectrun'){toast('Run selected','Select another completed run to compare the two snapshots.','warning')}
 else if(action.startsWith('reserve:')){let [,vehicle,type,battery,hub]=action.split(':');if(booking){toast('Reservation already active',`Cancel ${booking.vehicle} before reserving another vehicle.`,'warning')}else if(+battery>=90){toast('Reservation blocked','The vehicle is not offered by search if battery is at or above 90%.','warning')}else{booking={vehicle,type,battery,hub};toast('Reservation confirmed',`${vehicle} is held for you. Use pickup to start your ride.`);render()}}

 else if(action==='pickupvehicle'){let code=document.getElementById('pickupCode')?.value.trim();modal('Validate vehicle pickup',`<div class="callout">The backend validates the reservation owner, vehicle state and battery level before starting a trip.</div><div class="divider"></div><div class="carddesc">Entered code: <b>${escapeHtml(code||'(empty)')}</b></div>`,`${btn('Cancel','closemodal','')}${btn('Confirm pickup','confirm_pickup','primary')}`)}
 else if(action==='confirm_pickup'){closeModal();if(booking&&booking.battery<20){toast('Pickup blocked','Battery is below 20%. Choose another available vehicle.','warning')}else{tripActive=true;tripReturned=false;toast('Vehicle picked up','RentalVehicle moved to InUse.');move('M3','trip')}}
 else if(action==='confirmreturn'){let hub=document.getElementById('returnHub').value;let battery=+document.getElementById('returnBattery').value;let target=hubs.find(h=>h.name===hub);if(!Number.isInteger(battery)||battery<0||battery>100){toast('Invalid battery level','Enter an integer from 0 to 100.','warning')}else if(target.slotsFree===0){toast('Hub is full',`Return is blocked. Try ${hubs.find(h=>h.slotsFree>0&&h.name!==hub).name}.`,'warning')}else{tripActive=false;tripReturned=true;if(battery<20)chargeRequested=true;toast('Return completed',battery<20?'Vehicle returned. An automatic charging request was added for low battery.':'Vehicle return recorded and parking slot released.');move('M3','trip')}}

 else if(action.startsWith('editvehicle:')){let i=+action.split(':')[1];modal('Personal vehicle details',`<div class="callout">${escapeHtml(personalVehicles[i].plate)} · ${escapeHtml(personalVehicles[i].model)}</div><p class="modaldesc">Edit the vehicle registration through the same validation used on add.</p>`,`${btn('Close','closemodal','')}${btn('Mark inactive','inactivevehicle:'+i,'danger')}`)}

 else if(action==='savevehicle'){let plate=document.getElementById('newPlate')?.value.trim(),model=document.getElementById('newModel')?.value.trim(),battery=+document.getElementById('newBattery')?.value;if(!plate||!model||!Number.isInteger(battery)||battery<0||battery>100){toast('Check required fields','Enter a plate, model and battery between 0 and 100.','warning')}else if(personalVehicles.some(v=>v.plate.toLowerCase()===plate.toLowerCase())){toast('Plate already registered','Each license plate must be unique.','warning')}else{personalVehicles.push({plate,model,battery,status:'Active'});closeModal();toast('Vehicle registered',`${plate} is now available for parking and charging services.`);render()}}

 else if(action==='submitcharge'){let soc=+document.getElementById('requestSoc').value;let veh=document.getElementById('requestVehicle').value;if(!Number.isInteger(soc)||soc<0||soc>100){toast('Invalid battery value','Enter an integer from 0 to 100.','warning')}else if(soc>=90){toast('Request rejected','The battery is already at or above 90%.','warning')}else{chargeRequested=true;let id='CS-'+(2842+queue.length);queue.unshift({id,vehicle:veh.split(' · ')[0],hub:document.getElementById('requestHub').value,soc,priority:'NORMAL',B:100-soc,U:0,W:0,score:(.5*(100-soc)).toFixed(1),status:'Queued',wait:0,eta:'Calculating'});closeModal();toast('Charging request queued','Queue priority will be recalculated automatically.');move('M5','queue')}}

 else if(action.startsWith('adjust:')){let id=action.split(':')[1],q=queue.find(q=>q.id===id);if(!q)return;modal(`Adjust priority · ${id}`,`<div class="formgrid"><div class="field"><label>New priority</label><select id="adjPriority"><option>NORMAL</option><option>HIGH</option><option>URGENT</option></select></div><div class="field"><label>Scheduled start</label><input type="datetime-local" id="adjTime" /></div><div class="field wide"><label>Reason (required)</label><textarea id="adjReason" placeholder="Operational justification for this override"></textarea></div></div><div class="callout warning" style="margin-top:12px">The change is rejected if the session has already entered Charging. The operator, timestamp and reason are recorded.</div>`,`${btn('Cancel','closemodal','')}${btn('Save change','saveadjust:'+id,'primary')}`)}
 else if(action.startsWith('saveadjust:')){let id=action.split(':')[1],q=queue.find(q=>q.id===id),pr=document.getElementById('adjPriority').value,reason=document.getElementById('adjReason').value.trim();if(!reason){toast('Reason required','Enter a reason to audit the priority change.','warning')}else if(q.status==='Charging'){toast('Change blocked','A session already charging cannot be preempted.','warning')}else{q.priority=pr;q.score=pr==='URGENT'?100:q.score+(pr==='HIGH'?30:0);closeModal();toast('Priority updated',`${id} changed to ${pr}. Queue recalculation is triggered.`);subtab.M5='queue';handle('recalculate')}}
 else if(action==='chargerfailed'){let q=queue.find(q=>q.status==='Charging');if(q){q.status='Interrupted';let other=queue.find(x=>x.status==='Available');q.status='Queued';q.eta='Re-queued after port failure';q.wait+=1;queue.sort((a,b)=>(a.priority==='URGENT'?-999:b.priority==='URGENT'?999:b.score-a.score));toast('ChargerFailed handled',`${q.id}: latest SoC retained; no free replacement in demo, so returned to queue.`,'warning')}else toast('Failure simulated','Fault event recorded. No active charging session was found.');render()}
 else if(action.startsWith('assign:')||action.startsWith('start:')||action.startsWith('resolve:')||action.startsWith('close:')){let [verb,id]=action.split(':'),inc=incidents.find(i=>i.id===id);if(verb==='assign'){inc.status='Assigned';inc.assignee='Current operator';}else if(verb==='start'){inc.status='InProgress';}else if(verb==='resolve'){inc.status='Resolved';}else if(verb==='close'){inc.status='Closed';}toast('Incident updated',`${id} moved to ${inc.status}.`);render()}
 else if(action==='reportincident'){modal('Report an incident',`<div class="formgrid"><div class="field"><label>Hub</label><select id="incHub">${hubs.map(h=>`<option>${h.name}</option>`).join('')}</select></div><div class="field"><label>Resource</label><select id="incResource"><option>Charging point</option><option>Rental vehicle</option><option>Parking sensor</option></select></div><div class="field"><label>Resource ID</label><input id="incResourceId" placeholder="e.g. CP-07" /></div><div class="field"><label>Severity</label><select id="incSeverity"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field wide"><label>Reason & description</label><textarea id="incDesc" placeholder="Describe the observed fault"></textarea></div></div>`,`${btn('Cancel','closemodal','')}${btn('Submit report','submitincident','primary')}`)}
 else if(action==='submitincident'){let id='INC-'+(205+incidents.length),desc=document.getElementById('incDesc').value.trim(),resource=document.getElementById('incResourceId').value.trim();if(!desc||!resource){toast('Required fields missing','Enter a resource ID and incident description.','warning')}else{incidents.unshift({id,name:desc,hub:document.getElementById('incHub').value,severity:document.getElementById('incSeverity').value,status:'Reported',assignee:'Unassigned',age:'Just now',resource});closeModal();toast('Incident reported',`${id} created in Reported state.`);render()}}
 else if(action==='runtick'){let s=document.getElementById('simScenario').value,n=document.getElementById('simTicks').value;document.getElementById('tickResult').innerHTML=`<div class="callout success">✓ Deterministic simulation tick completed<br><span class="tiny">Scenario: ${escapeHtml(s)} · ${escapeHtml(n)} · Seed 261-05 · Event IDs deduplicated</span></div>`;toast('Simulator tick completed','Synthetic readings processed with repeatable seed.');}
 else if(action==='createtask'){move('M7','create')}
 else if(action==='submittransfer'){let v=document.getElementById('transferVehicle').value,from=document.getElementById('transferFrom').value,to=document.getElementById('transferTo').value,reason=document.getElementById('transferReason').value.trim();if(from===to){toast('Invalid route','Source and destination Hub must differ.','warning')}else if(v.includes('Booked')){toast('Transfer rejected','Booked vehicles cannot be redistributed.','warning')}else{let taskId='DST-'+String(42+tasks.length).padStart(3,'0');tasks.unshift({id:taskId,vehicle:v.split(' · ')[0],from,to,status:'Created',created:'Now'});toast('Transfer task created',`${taskId} is now in Created state. ${reason?'Reason saved.':''}`);move('M7','tasks')}}
 else if(action.startsWith('approve:')){let id=action.split(':')[1],r=recommendations.find(x=>x.id===id);r.status='Approved';let tid='DST-'+String(42+tasks.length).padStart(3,'0');tasks.unshift({id:tid,vehicle:'EB-'+String(300+tasks.length),from:r.from,to:r.to,status:'Created',created:'Now'});toast('Recommendation approved',`${id} converted to task ${tid}.`);render()}
 else if(action.startsWith('reject:')){let r=recommendations.find(x=>x.id===action.split(':')[1]);r.status='Rejected';toast('Recommendation rejected','No redistribution task was created.');render()}
 else if(action.startsWith('taskstart:')){let t=tasks.find(x=>x.id===action.split(':')[1]);t.status='InProgress';toast('Task started',`${t.id} is InProgress.`);render()}
 else if(action.startsWith('taskdone:')){let t=tasks.find(x=>x.id===action.split(':')[1]);t.status='Done';toast('Task completed',`${t.id} marked Done.`);render()}
 else if(action.startsWith('preset:')){scenarioPreset=action.split(':')[1];if(scenarioPreset==='metro')scenarioName='Metro peak-hour surge';if(scenarioPreset==='parking')scenarioName='Hub parking saturation';if(scenarioPreset==='charging')scenarioName='Charging demand surge';if(scenarioPreset==='charger')scenarioName='Partial charger failure';if(scenarioPreset==='balance')scenarioName='Fleet imbalance';render()}
 else if(action==='suggestscenario'){toast('AI parameter suggestions ready','Suggestions remain editable; resolve missing fields and confirm Save & Run.');}
 else if(action==='runsimulation'||action==='runscheduled'){let name=document.getElementById('scenarioName')?.value||scenarioName;let arrivals=+(document.getElementById('scenarioArrivals')?.value||120),failed=+(document.getElementById('scenarioFailed')?.value||0);let hubName=document.getElementById('scenarioHub')?.value||'Metro Gateway';let selectedHub=hubs.find(h=>h.name===hubName);if(arrivals<0||failed<0||!Number.isInteger(arrivals)||!Number.isInteger(failed)){toast('Invalid scenario','Counts must be non-negative integers.','warning')}else if(failed>(selectedHub?.ports||0)){toast('Invalid resource change',`Failed charging points cannot exceed the ${(selectedHub?.ports)||0} installed points at ${hubName}.`,'warning')}else{scenarioName=name;scenarioRun=true;runNumber++;simulationValues={service:Math.min(99.8,86.6+(arrivals>0?Math.min(8,arrivals/30):0)-failed*2),wait:Math.max(1.2,8.9-arrivals/100+failed*1.8),util:Math.min(98,68+arrivals/10+failed*4)};toast('Simulation completed',`RUN-${runNumber} saved. KPI values are deterministic mock outputs for UI demonstration.`);render()}}
 else if(action==='applyrec'){toast('Recommendation submitted','Operational service accepted the request for feasibility validation. This demo does not change live resources.','warning')}
 else if(action==='discardrec'){toast('Recommendation discarded','The proposal remains in history and is not applied.');}
 else if(action==='runscheduled'){toast('Scheduled run viewed','Scheduled cycles never apply operational actions automatically.');}
 else if(action==='ackalert'){toast('Alert acknowledged','Operator and timestamp would be recorded.');}
 else if(action==='dismissalert'){modal('Dismiss alert','<div class="field"><label>Dismissal reason (required)</label><textarea id="dismissReason" placeholder="Explain why this alert can be dismissed"></textarea></div>',`${btn('Cancel','closemodal','')}${btn('Confirm dismiss','confirmdismiss','primary')}`)}
 else if(action==='confirmdismiss'){let val=document.getElementById('dismissReason').value.trim();if(!val)toast('Reason required','Add a dismissal reason.','warning');else{closeModal();toast('Alert dismissed','Reason saved to the alert audit history.')}}
 else if(action==='exportalerts'||action==='exportincidents'){toast('Export prepared','This prototype demonstrates the export affordance; no file is generated from demo data.','warning')}
 else if(action==='recalculate'){/* handled above */}
 else if(action==='closemodal')closeModal();else if(action==='closetoast')document.getElementById('toastRoot').innerHTML='';
}
document.addEventListener('click',e=>{
 const roleBtn=e.target.closest('button[data-role]');if(roleBtn){role=roleBtn.dataset.role;render();return}
 const nav=e.target.closest('[data-module]');if(nav){move(nav.dataset.module,nav.dataset.starttab||undefined);return}
 const tab=e.target.closest('[data-tab]');if(tab){subtab[currentModule]=tab.dataset.tab;render();return}
 const preset=e.target.closest('[data-preset]');if(preset){handle('preset:'+preset.dataset.preset);return}
 const space=e.target.closest('[data-space]');if(space){selectedSpace=+space.dataset.space;render();return}
 const hub=e.target.closest('[data-hub]');if(hub){let h=hubs[+hub.dataset.hub];modal(h.name,`<div class="carddesc">${h.area}</div><div class="grid three" style="margin-top:15px"><div class="kpibox"><span>Vehicles free</span><strong>${h.available}</strong></div><div class="kpibox"><span>Parking slots free</span><strong>${h.slotsFree}/${h.slots}</strong></div><div class="kpibox"><span>Charging free</span><strong>${h.portsFree}/${h.ports}</strong></div></div><div class="divider"></div><p class="modaldesc">Hub utilization: ${h.util}%. Operational state is supplied by current resource telemetry.</p>`,`${btn('Close','closemodal','')}${btn(role==='Student'?'Find vehicles':'Review alert','closemodal','primary')}`);return}
 const b=e.target.closest('[data-action]');if(b){let a=b.dataset.action;if(a==='modalback'&&e.target===b){closeModal();return}handle(a)}
});
document.addEventListener('input',e=>{if(e.target.id==='batteryMin')document.getElementById('batteryMinLabel').textContent=e.target.value+'%';if(e.target.id==='hubSearch'||e.target.id==='hubFilter'){document.querySelectorAll('.hubcard').forEach((c,i)=>{let h=hubs[i],q=(document.getElementById('hubSearch')?.value||'').toLowerCase(),f=document.getElementById('hubFilter')?.value||'all';let match=h.name.toLowerCase().includes(q)||h.area.toLowerCase().includes(q);if(f==='vehicle')match=match&&h.available>0;if(f==='slots')match=match&&h.slotsFree>0;if(f==='charge')match=match&&h.portsFree>0;c.style.display=match?'':'none'})}});
document.addEventListener('change',e=>{if(e.target.id==='previewModule'){move(e.target.value);return}if(['vehicleHub','vehicleType','batteryMin'].includes(e.target.id)){let hub=document.getElementById('vehicleHub')?.value||'All hubs',type=document.getElementById('vehicleType')?.value||'All types',min=+(document.getElementById('batteryMin')?.value||0);document.querySelectorAll('.vehiclecard').forEach(c=>{let txt=c.innerText;c.style.display=(hub==='All hubs'||txt.includes(hub))&&(type==='All types'||txt.includes(type))&&(+txt.match(/Battery level\s*(\d+)%/)?.[1]||0)>=min?'':'none'})} });
render();
</script>
</body>
</html>
