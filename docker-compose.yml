services:
  db:
    image: postgres:16
    container_name: emobility-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emobility}
      POSTGRES_USER: ${POSTGRES_USER:-emobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emobility}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emobility}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
