spring:
  application:
    name: smart-emobility-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/emobility
    username: emobility
    password: emobility
  jpa:
    hibernate:
      ddl-auto: validate      # KHONG dung update - schema do Flyway quan ly (TV4)
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true   # cho phep chay V40, V50 sau V70 (quy uoc V(n×10))
  jackson:
    serialization:
      write-dates-as-timestamps: false   # ngay gio dang ISO-8601

server:
  port: 8080

app:
  demo-users:
    enabled: true      # tao student1 / operator1 khi bang app_user rong
  demo:
    seed-parking: true # M4: 31 luot dat that o Hub Ga Metro (77%) de M1/M2/M4/M8 cung so lieu; tat = false
  cors:
    allowed-origin: http://localhost:5173
  reservation:
    hold-minutes: 15          # BR-M2-02
  parking:
    no-show-scan-ms: 60000    # UC-M4-04: luoi an toan giai phong cho qua han (Timer chinh la cua M2)
  charging:
    low-battery-threshold: 20 # BR-M5-01 (%)
    recalculation-interval-ms: 60000 # FR-M5-04: chu ky xep hang doi, giu cong 10 phut, sac
    initial-delay-ms: 10000          # cho app khoi dong xong moi chay lan dau

  # --- M1: nguong canh bao (BR-M1-03, BR-M1-04, BR-M1-05, BR-M1-07) ---
  monitoring:
    capacity-raise-threshold: 80     # bat canh bao khi ty le cho do >= 80%
    capacity-clear-threshold: 75     # tat canh bao khi xuong duoi 75%
    low-vehicle-threshold: 2         # bat canh bao khi con <= 2 xe kha dung
    low-vehicle-clear-threshold: 4   # tat canh bao khi >= 4 xe
    evaluation-interval-ms: 30000    # chu ky danh gia
    initial-delay-ms: 10000          # cho app khoi dong xong moi chay lan dau

  # --- M6: simulator thiet bi ---
  simulator:
    # Tat khi quay demo: scheduler chay NORMAL_TICK 5 giay/lan nen tru sac hong (CHARGER_FAILURE)
    # tu hoat dong lai truoc khi nguoi xem kip thay.
    scheduler-enabled: false
    interval-ms: 5000
    # BAT BUOC: SimulatorScheduler doc bang getRequiredProperty. Seed 100 bao pin xe 1 (EB-001) la 92%,
    # dung bang du lieu V2, nen NORMAL_TICK khong lam doi pin xe; seed 42 bao 15% -> M3 chuyen xe sang LOW_BATTERY.
    seed: 100

logging:
  level:
    com.hcmut.emobility: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
