spring:
  application:
    name: smart-emobility-hub
  datasource:
    url: jdbc:postgresql://localhost:5432/emobility
    username: emobility
    password: emobility
  jpa:
    hibernate:
      ddl-auto: validate      # KHONG dung update - schema do Flyway quan ly (TV4)
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true   # cho phep chay V40, V50 sau V70 (quy uoc V(n×10))
  jackson:
    serialization:
      write-dates-as-timestamps: false   # ngay gio dang ISO-8601

server:
  port: 8080

app:
  demo-users:
    enabled: true      # tao student1 / operator1 khi bang app_user rong
  cors:
    allowed-origin: http://localhost:5173
  reservation:
    hold-minutes: 15          # BR-M2-02
  charging:
    low-battery-threshold: 20 # BR-M5-01 (%)

  # --- M1: nguong canh bao (BR-M1-03, BR-M1-04, BR-M1-05, BR-M1-07) ---
  monitoring:
    capacity-raise-threshold: 80     # bat canh bao khi ty le cho do >= 80%
    capacity-clear-threshold: 75     # tat canh bao khi xuong duoi 75%
    low-vehicle-threshold: 2         # bat canh bao khi con <= 2 xe kha dung
    low-vehicle-clear-threshold: 4   # tat canh bao khi >= 4 xe
    evaluation-interval-ms: 30000    # chu ky danh gia
    initial-delay-ms: 10000          # cho app khoi dong xong moi chay lan dau

  # --- M6: simulator thiet bi ---
  simulator:
    scheduler-enabled: false   # bat len khi quay demo
    interval-ms: 5000
    seed: 42                   # BAT BUOC: SimulatorScheduler doc bang getRequiredProperty

logging:
  level:
    com.hcmut.emobility: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
